name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pydantic numpy pytest
      - run: python -c "from schemas.common import SentimentResult; s=SentimentResult(label='positive',score=0.9,reasoning='good',key_phrases=[]); assert s.label=='positive'; print('schemas OK')"
      - run: python extract.py
